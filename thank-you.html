<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Smart Menu Solutions</title>
<link rel="icon" type="image/png" href="https://primary.jwwb.nl/public/q/b/h/temp-qwfllybferzrbmruxsqy/designer-6-photoroom-high.png?enable-io=true&amp;enable=upscale&amp;height=64">
<style>
  :root{--ink:#262421;--grey:#737373;--orange:#F66A09;--paper:#fff;--line:#E7E5E1}
  *{box-sizing:border-box}
  body{margin:0;background:#FAFAF9;color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;text-align:center}
  .site-header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:12px 24px}
  .brand{display:inline-flex;align-items:center;gap:.65rem;text-decoration:none;color:var(--ink);font-weight:700;font-size:1.15rem}
  .brand img{height:42px;width:auto}.n-smart{color:var(--orange)}
  .lang-switcher{position:absolute;right:24px;top:16px;display:flex;gap:6px}.lang-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}.lang-btn.active,.lang-btn:hover{background:var(--orange);border-color:var(--orange);color:#fff}
  main{max-width:760px;margin:0 auto;padding:clamp(5rem,12vw,9rem) 24px}
  .check{width:64px;height:64px;margin:0 auto 1.8rem;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center;color:var(--orange);font-size:2rem}
  .status{display:inline-block;margin-bottom:1.25rem;padding:.45rem .8rem;border-radius:999px;background:#EAF7EE;color:#267342;font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  h1{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1.05;margin:0 0 1rem}.accent{color:var(--orange)}
  .lede{font-size:1.12rem;color:var(--grey);max-width:40rem;margin:0 auto 2.5rem}
  .message{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(1.6rem,5vw,3rem);box-shadow:0 14px 30px -18px rgba(38,36,33,.35)}
  h2{font-size:1.55rem;margin:0 0 .7rem}.message p{color:var(--grey);line-height:1.6;margin:.5rem auto;max-width:42rem}
  .actions{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}.btn{display:inline-block;padding:.85em 1.6em;border-radius:6px;background:var(--orange);color:#fff;text-decoration:none;font-weight:700}.btn:hover{background:#D85D06}.btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-secondary:hover{background:#F3F1EE}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><img src="https://primary.jwwb.nl/public/q/b/h/temp-qwfllybferzrbmruxsqy/designer-6-photoroom-high.png?enable=io=true&amp;enable=upscale&amp;height=70" alt=""><span><span class="n-smart">Smart</span> Menu Solutions</span></a><div class="lang-switcher"><button class="lang-btn" type="button" data-lang="de">DE</button><button class="lang-btn active" type="button" data-lang="en">EN</button></div></header>
<main>
  <div class="check" aria-hidden="true">✓</div>
  <div class="status">Order received</div>
  <h1 id="thankTitle">Thank <span class="accent">you!</span></h1>
  <p class="lede" id="thankSub">Your request has been sent successfully.</p>
  <section class="message">
    <h2 id="thankHeading">We've received your details</h2>
    <p id="thankText">Thank you for your interest in Smart Menu Solutions. Our team will review your request and get back to you shortly, usually within 24 hours.</p>
    <div class="actions">
      <a class="btn btn-secondary" id="homeLink" href="index.html">Return to homepage</a>
    </div>
  </section>
</main>
<script>
  var thankYouCopy = {
    en: { title: 'Thank <span class="accent">you!</span>', sub: 'Your request has been sent successfully.', heading: "We've received your details", text: 'Thank you for your interest in Smart Menu Solutions. Our team will review your request and get back to you shortly, usually within 24 hours.', home: 'Return to homepage' },
    de: { title: 'Vielen <span class="accent">Dank!</span>', sub: 'Ihre Anfrage wurde erfolgreich übermittelt.', heading: 'Wir haben Ihre Daten erhalten', text: 'Vielen Dank für Ihr Interesse an Smart Menu Solutions. Unser Team prüft Ihre Anfrage und meldet sich in Kürze, normalerweise innerhalb von 24 Stunden.', home: 'Zur Startseite' }
  };
  function setThankLanguage(lang) {
    var copy = thankYouCopy[lang];
    document.documentElement.lang = lang;
    document.getElementById('thankTitle').innerHTML = copy.title;
    document.getElementById('thankSub').textContent = copy.sub;
    document.getElementById('thankHeading').textContent = copy.heading;
    document.getElementById('thankText').textContent = copy.text;
    document.getElementById('homeLink').textContent = copy.home;
    document.querySelectorAll('[data-lang]').forEach(function (button) { button.classList.toggle('active', button.getAttribute('data-lang') === lang); });
    localStorage.setItem('selectedLang', lang);
  }
  document.querySelectorAll('[data-lang]').forEach(function (button) { button.addEventListener('click', function () { setThankLanguage(button.getAttribute('data-lang')); }); });
  setThankLanguage(localStorage.getItem('selectedLang') || 'en');
</script>
</body>
</html>
