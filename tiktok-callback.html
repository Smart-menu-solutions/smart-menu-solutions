<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TikTok authorization</title>
<style>
  body{ font-family: system-ui, sans-serif; background:#f4efe6; color:#262421; padding:40px 20px; }
  .box{ max-width:640px; margin:0 auto; background:#fff; border:1px solid #ddd2bc; border-radius:14px; padding:32px; }
  h1{ font-size:1.3rem; }
  .code-box{ background:#fff1e4; border:1px solid #f66a09; border-radius:10px; padding:16px; word-break:break-all; font-family:ui-monospace,monospace; font-size:.95rem; margin:16px 0; }
  .empty{ color:#8a877e; }
  button{ background:#f66a09; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>Authorization code</h1>
    <p>Copy the value below and send it back.</p>
    <div class="code-box" id="code">Reading URL...</div>
    <button onclick="copyCode()">Copy</button>
  </div>
<script>
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');
  var el = document.getElementById('code');
  if (code) {
    el.textContent = code;
  } else if (error) {
    el.textContent = 'Error: ' + error + ' - ' + (params.get('error_description') || '');
  } else {
    el.textContent = 'No code found in URL.';
    el.className = 'code-box empty';
  }
  function copyCode(){
    navigator.clipboard.writeText(el.textContent).catch(function(){});
  }
</script>
</body>
</html>
