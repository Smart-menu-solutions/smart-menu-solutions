name: Render content card (test)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day number from content_calendar.csv (1-180)"
        required: true
        default: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: automation
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Render card
        working-directory: automation
        run: python render_card.py "${{ inputs.day }}" "output/day-${{ inputs.day }}.png"

      - uses: actions/upload-artifact@v4
        with:
          name: card-day-${{ inputs.day }}
          path: automation/output/day-${{ inputs.day }}.png
