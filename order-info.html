<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellung - Smart Menu Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="order-container">
        <h1>Digitale Speisekarte anfordern</h1>
        <p>Fülle das Formular aus und lade deine aktuelle Speisekarte als PDF hoch.</p>

        <form class="order-form" action="https://formsubmit.co/smartmenusolutions@outlook.com" method="POST" enctype="multipart/form-data">
            <!-- Weiterleitung zur Thank-You-Seite nach erfolgreichem Absenden -->
            <input type="hidden" name="_next" value="https://DEIN-GITHUB-BENUTZERNAME.github.io/DEIN-REPO-NAME/thank-you.html">
            <input type="hidden" name="_subject" value="Neue Bestellung eingegangen! - Smart Menu Solutions">
            <input type="hidden" name="_captcha" value="false">

            <div class="form-group">
                <label for="restaurant">Restaurant-Name:</label>
                <input type="text" id="restaurant" name="Restaurant_Name" required>
            </div>

            <div class="form-group">
                <label for="name">Dein Name:</label>
                <input type="text" id="name" name="Ansprechpartner" required>
            </div>

            <div class="form-group">
                <label for="email">E-Mail-Adresse:</label>
                <input type="email" id="email" name="Kunden_Email" required>
            </div>

            <div class="form-group">
                <label for="phone">Telefonnummer:</label>
                <input type="tel" id="phone" name="Telefonnummer" required>
            </div>

            <div class="form-group">
                <label for="menu-file">Speisekarte (PDF hochladen):</label>
                <input type="file" id="menu-file" name="Speisekarte_PDF" accept=".pdf" required>
            </div>

            <button type="submit" class="submit-btn">Bestellung absenden</button>
        </form>
    </div>
</body>
</html>
