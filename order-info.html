<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Bestellung | Smart Menu Solutions</title>
<link rel="icon" type="image/png" href="https://primary.jwwb.nl/public/q/b/h/temp-qwfllybferzrbmruxsqy/designer-6-photoroom-high.png?enable-io=true&enable=upscale&height=64">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f9fafb;
    color: #1f2937;
    margin: 0;
    padding: 0;
  }
  .site-header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 0; position: sticky; top: 0; z-index: 1000; }
  .header-inner { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 1.15rem; color: #111; }
  .brand img { height: 38px; }
  .n-smart { color: #f97316; }

  .nav-menu { display: flex; align-items: center; gap: 24px; list-style: none; margin: 0; padding: 0; }
  .nav-menu a { text-decoration: none; color: #4b5563; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
  .nav-menu a:hover, .nav-menu a.active { color: #f97316; }

  .header-right { display: flex; align-items: center; gap: 16px; }
  .btn-get-started { background: #f97316; color: #fff; padding: 10px 20px; border-radius: 50px; font-weight: 600; font-size: 0.9rem; text-decoration: none; transition: background 0.2s; }
  .btn-get-started:hover { background: #ea580c; }

  .lang-switcher { display: flex; gap: 6px; }
  .lang-btn {
    background: #f3f4f6;
    border: 1px solid #d1d5db;
    padding: 6px 12px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.8rem;
    color: #374151;
    transition: all 0.2s;
  }
  .lang-btn.active, .lang-btn:hover {
    background: #f97316;
    color: #fff;
    border-color: #f97316;
  }

  .container { max-width: 1100px; margin: 50px auto; padding: 0 20px; text-align: center; }
  h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 15px; color: #111; }
  h1 span { color: #f97316; }
  p { color: #6b7280; font-size: 1.1rem; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <img src="https://primary.jwwb.nl/public/q/b/h/temp-qwfllybferzrbmruxsqy/designer-6-photoroom-high.png?enable-io=true&enable=upscale&height=70" alt="Logo">
      <span class="brand-text"><span class="n-smart">Smart</span> Menu Solutions</span>
    </a>

    <ul class="nav-menu">
      <li><a href="index.html" id="navHome">Startseite</a></li>
      <li><a href="our-services.html" id="navServices">Unsere Dienste</a></li>
      <li><a href="pricing-plans.html" id="navPricing">Preise</a></li>
      <li><a href="faq.html" id="navFaq">FAQ</a></li>
      <li><a href="order.html" class="active" id="navOrder">Bestellen</a></li>
      <li><a href="contact.html" id="navContact">Kontakt</a></li>
    </ul>

    <div class="header-right">
      <a href="order-info.html" class="btn-get-started" id="btnGetStarted">Loslegen</a>
      <div class="lang-switcher">
        <button class="lang-btn active" id="btnDe" onclick="setLanguage('de')">DE</button>
        <button class="lang-btn" id="btnEn" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <h1 id="mainTitle">Deine Bestellung <span>starten</span></h1>
  <p id="mainDesc">Fülle deine Daten aus, wähle einen Plan und lade deine Speisekarte hoch – den Rest erledigen wir.</p>
</main>

<script>
  function setLanguage(lang) {
    const btnDe = document.getElementById('btnDe');
    const btnEn = document.getElementById('btnEn');
    if (lang === 'de') {
      btnDe.classList.add('active'); btnEn.classList.remove('active');
      document.getElementById('pageTitle').textContent = "Bestellung | Smart Menu Solutions";
      // Navbar
      document.getElementById('navHome').textContent = "Startseite";
      document.getElementById('navServices').textContent = "Unsere Dienste";
      document.getElementById('navPricing').textContent = "Preise";
      document.getElementById('navFaq').textContent = "FAQ";
      document.getElementById('navOrder').textContent = "Bestellen";
      document.getElementById('navContact').textContent = "Kontakt";
      document.getElementById('btnGetStarted').textContent = "Loslegen";
      // Content
      document.getElementById('mainTitle').innerHTML = "Deine Bestellung <span>starten</span>";
      document.getElementById('mainDesc').textContent = "Fülle deine Daten aus, wähle einen Plan und lade deine Speisekarte hoch – den Rest erledigen wir.";
    } else {
      btnEn.classList.add('active'); btnDe.classList.remove('active');
      document.getElementById('pageTitle').textContent = "Order | Smart Menu Solutions";
      // Navbar
      document.getElementById('navHome').textContent = "Home";
      document.getElementById('navServices').textContent = "Our Services";
      document.getElementById('navPricing').textContent = "Pricing Plans";
      document.getElementById('navFaq').textContent = "FAQ";
      document.getElementById('navOrder').textContent = "Order";
      document.getElementById('navContact').textContent = "Contact";
      document.getElementById('btnGetStarted').textContent = "Get started";
      // Content
      document.getElementById('mainTitle').innerHTML = "Start your <span>Order</span>";
      document.getElementById('mainDesc').textContent = "Fill in your details, choose a plan and upload your menu – we'll take care of the rest.";
    }
  }
</script>
</body>
</html>
